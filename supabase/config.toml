# Minimal Supabase CLI config. Adjust project_id to your project ref after
# `npx supabase link --project-ref <ref>`. Full options:
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "week-canvas"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Local email testing UI (Mailpit). Playwright's signup spec reads links here.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:4000"
additional_redirect_urls = ["http://localhost:4000/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false # set true in production once custom SMTP is configured

[auth.external.google]
enabled = false # set true and provide client id/secret via env to enable Google
client_id = ""
secret = ""
redirect_uri = ""
